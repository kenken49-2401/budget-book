<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget Book</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><span class="eyebrow">BUDGET BOOK / PROTOTYPE</span><h1>暮らしの家計簿</h1><p>日々の記録を、ひとつずつ。</p></div><button id="new">＋ 記録する</button></header><div class="notice">試作版：データはこのブラウザに保存されます。端末間の自動同期はまだできません。大切な記録はバックアップしてください。</div><nav class="month"><button id="prev" class="icon" aria-label="前の月">←</button><h2 id="month"></h2><button id="next" class="icon" aria-label="次の月">→</button><button id="today" class="text">今月へ</button></nav><section class="summary"><article><span>収入</span><strong id="income"></strong></article><article><span>支出</span><strong id="expense"></strong></article><article class="balance"><span>今月の収支</span><strong id="balance"></strong></article></section><div class="layout"><section class="panel"><div class="section-head"><div><span class="eyebrow">TRANSACTIONS</span><h2>記録一覧</h2></div><span id="count" class="muted"></span></div><div id="list"></div></section><section class="panel"><span class="eyebrow">BREAKDOWN</span><h2>支出の内訳</h2><div id="breakdown"></div></section></div><footer><p>バックアップにはレシート画像を含む家計データが平文で保存されます。安全な場所に保管してください。</p><button id="export" class="secondary">バックアップを書き出す</button> <label class="upload">バックアップを復元<input type="file" id="import" accept="application/json,.json" hidden></label></footer></main><dialog id="dialog"><form id="form"><div class="section-head"><div><span class="eyebrow">NEW ENTRY</span><h2 id="form-title">記録を追加</h2></div><button type="button" class="icon" id="close" aria-label="閉じる">✕</button></div><div class="form-grid"><label>種類<select name="type"><option value="expense">支出</option><option value="income">収入</option></select></label><label>日付<input name="date" type="date" required></label><label>金額（円）<input name="amount" type="number" min="1" step="1" required inputmode="numeric" placeholder="0"></label><label>カテゴリー<input name="category" list="categories" required maxlength="40" placeholder="食費"><datalist id="categories"><option value="食費"><option value="日用品"><option value="住居"><option value="水道・光熱費"><option value="交通"><option value="趣味・娯楽"><option value="医療"><option value="給与"><option value="その他"></datalist></label></div><label>店名・メモ<input name="memo" maxlength="100" placeholder="例：スーパー"></label><label>レシート写真<input name="receipt" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label><div id="receipt-preview"></div><label id="remove-receipt-label" hidden><input type="checkbox" name="removeReceipt"> 写真を削除する</label><p class="hint">写真はブラウザ内に保存します。文字の自動読み取りは未対応です。</p><p id="error" role="alert" class="error"></p><div class="actions"><button type="button" class="secondary" id="cancel">キャンセル</button><button type="submit">保存する</button></div></form></dialog><script type="module" src="src/app.mjs"></script></body></html>
